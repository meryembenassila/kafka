spring.application.name=kafka
server.port=8080
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=t1

spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=t3
# pour modifier durée dont le supplier envoie les messages
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200

spring.cloud.stream.bindings.KSteamFunction-in-0.destination=t3
spring.cloud.stream.bindings.KSteamFunction-out-0.destination=t4
# au bout de 1 seconde il calcules (cad le groupe by ) , car par defaut c'est 4s
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000


spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;KSteamFunction